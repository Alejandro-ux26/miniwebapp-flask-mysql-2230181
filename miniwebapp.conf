<VirtualHost *:80>
    ServerName 192.168.60.3
    WSGIDaemonProcess miniwebapp python-path=/var/www/miniwebapp
    WSGIProcessGroup miniwebapp
    WSGIScriptAlias / /var/www/miniwebapp/application.wsgi
    DocumentRoot /var/www/miniwebapp
    <Directory /var/www/miniwebapp>
        Require all granted
    </Directory>
</VirtualHost>

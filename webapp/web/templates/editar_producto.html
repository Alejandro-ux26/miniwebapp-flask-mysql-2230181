<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="pt-4">
<div class="container" style="max-width: 560px;">
    <h2>Editar producto</h2>
    <a href="/productos" class="btn btn-outline-secondary mb-3">Volver a productos</a>

    <div id="mensaje"></div>

    <form id="form-editar">
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" class="form-control" id="nombre" maxlength="100" required>
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <input type="text" class="form-control" id="descripcion" maxlength="255">
        </div>
        <div class="form-group">
            <label for="precio">Precio</label>
            <input type="number" class="form-control" id="precio" min="0" step="0.01" required>
        </div>
        <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" class="form-control" id="stock" min="0" step="1" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>
</div>

<script src="/static/productos.js"></script>
<script>
    // La ruta usa <int:id>, así que {{ id }} siempre es un número
    const productoId = {{ id }};
    cargarProducto(productoId);
    document.getElementById('form-editar').addEventListener('submit', function (evento) {
        guardarCambios(evento, productoId);
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de productos</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="pt-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Productos</h2>
        <a href="/" class="btn btn-outline-secondary">Ir a usuarios</a>
    </div>

    <div id="mensaje"></div>

    <form id="form-producto" class="mb-4">
        <div class="form-row">
            <div class="form-group col-md-3">
                <label for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" maxlength="100" required>
            </div>
            <div class="form-group col-md-4">
                <label for="descripcion">Descripción</label>
                <input type="text" class="form-control" id="descripcion" maxlength="255">
            </div>
            <div class="form-group col-md-2">
                <label for="precio">Precio</label>
                <input type="number" class="form-control" id="precio" min="0" step="0.01" required>
            </div>
            <div class="form-group col-md-1">
                <label for="stock">Stock</label>
                <input type="number" class="form-control" id="stock" min="0" step="1" value="0" required>
            </div>
            <div class="form-group col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-success btn-block">Crear producto</button>
            </div>
        </div>
    </form>

    <table id="tabla-productos" class="table table-striped">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="/static/productos.js"></script>
<script>
    document.getElementById('form-producto').addEventListener('submit', crearProducto);
    listarProductos();
</script>
</body>
</html>
